<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>開心農場 - 存檔擴充版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>🌻 我的開心農場</h1>
        
        <div id="character">🧑</div>
        
        <div id="stats">
            💰 金錢: $<span id="money-display">150</span> | 
            ⭐ 等級: <span id="level-display">1</span>
            
            <!-- 經驗值與分段升級 -->
            <div class="exp-container">
                經驗: <span id="exp-bar">⬜⬜⬜⬜⬜</span>
                <button id="btn-levelup" class="upgrade-btn">特訓 ($<span id="levelup-cost">16</span>)</button>
            </div>
            
            <div style="margin-top:10px;">
                <button id="btn-save" class="sys-btn">💾 手動存檔</button>
                <button id="btn-reset" class="sys-btn reset-btn">🗑️ 清除紀錄</button>
            </div>
        </div>

        <div class="shop-container">
            <div class="shop" id="crop-shop">
                <h3>🌱 種子商店</h3>
                <button class="buy-btn" data-type="crop" data-id="cabbage">高麗菜 $10</button>
                <button class="buy-btn" data-type="crop" data-id="carrot">蘿蔔 $40 (Lv.2)</button>
                <button class="buy-btn" data-type="crop" data-id="tomato">番茄 $100 (Lv.3)</button>
                <button class="buy-btn" data-type="crop" data-id="corn">玉米 $200 (Lv.4)</button>
                <button class="buy-btn" data-type="crop" data-id="strawberry">草莓 $400 (Lv.5)</button>
                <button class="buy-btn" data-type="crop" data-id="watermelon">西瓜 $800 (Lv.6)</button>
            </div>
            <div class="shop" id="animal-shop">
                <h3>🐾 動物商店</h3>
                <button class="buy-btn" data-type="animal" data-id="chicken">🐔 雞 $30</button>
                <button class="buy-btn" data-type="animal" data-id="duck">🦆 鴨 $90 (Lv.2)</button>
                <button class="buy-btn" data-type="animal" data-id="eagle">🦅 鷹 $270 (Lv.3)</button>
                <button class="buy-btn" data-type="animal" data-id="pig">🐖 豬 $500 (Lv.4)</button>
                <button class="buy-btn" data-type="animal" data-id="sheep">🐑 羊 $1000 (Lv.5)</button>
                <button class="buy-btn" data-type="animal" data-id="cow">🐄 牛 $2500 (Lv.6)</button>
            </div>
        </div>

        <p class="hint">系統每 5 秒自動存檔。離線時動植物也會繼續長大喔！</p>

        <!-- 獨立分頁雙九宮格 -->
        <div class="farm-container">
            
            <!-- 農田區 -->
            <div class="area-wrapper">
                <h2>🌱 農田區 (第<span id="crop-page-num">1</span>頁)</h2>
                <div class="pagination-controls">
                    <button class="nav-arrow" id="crop-prev">◀</button>
                    <button class="nav-arrow" id="crop-next">▶</button>
                </div>
                <div id="field" class="grid-area">
                    <!-- 18個格子透過 JS 動態產生，方便管理存檔 -->
                </div>
            </div>

            <!-- 牧場區 -->
            <div class="area-wrapper">
                <h2>🐾 牧場區 (第<span id="animal-page-num">1</span>頁)</h2>
                <div class="pagination-controls">
                    <button class="nav-arrow" id="animal-prev">◀</button>
                    <button class="nav-arrow" id="animal-next">▶</button>
                </div>
                <div id="pasture" class="grid-area">
                    <!-- 18個格子透過 JS 動態產生，方便管理存檔 -->
                </div>
            </div>
        </div>
    </div>

    <script src="Player.js"></script>
    <script src="Crop.js"></script>
    <script src="Animal.js"></script>
    <script src="main.js"></script>
</body>
</html>
